controller_node:
  ros__parameters:
    mass: 0.0282
    gravity: 9.81
    dt: 0.001
    max_tilt_angle_deg: 35.0

    # Spokojne nastawy pozycji - zapobiegają gwałtownym zrywom
    Kp: [2.8, 2.8, 1.6]

    # Kv: Podnosimy tłumienie w osiach X i Y dla stabilizacji wyższego Kp.
    # Zwiększamy również tłumienie w osi Z, aby wygładzić ruch w pionie.
    Kv: [0.72, 0.72, 0.64]

    # KR i KOmega: Umiarkowane w osiach X/Y, mocniejsze w osi Z.
    # Niższy kąt przechyłu i lepsze tłumienie roll/pitch powinny ograniczyć 'back flip'.
    KR: [3.2e-3, 3.2e-3, 15.0e-2]
    KOmega: [2.4e-3, 2.4e-3, 15.0e-2]